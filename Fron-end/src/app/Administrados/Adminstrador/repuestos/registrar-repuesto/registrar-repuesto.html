<div class="layout">
  <aside class="sidebar">
    <!-- menú -->
     <app-header-admin></app-header-admin>
  </aside>

  <main class="content">
    <!-- contenido principal -->
     <app-header></app-header>

     <div class="content-repueto">

      <div class="titulo">
        <h1>Agragar un nuevo repuesto</h1>
        <p>Complete todos los campos del </p>
      </div>

      <form (ngSubmit)="crearRepuesto()">

        <div class="campo">
          <label>Nombre</label>
          <input type="text" name="nombre" [(ngModel)]="nombre">
        </div>

        <div class="campo">
          <label>Marca</label>
          <input type="text" name="marca" [(ngModel)]="marca">
        </div>

        <div class="campo">
          <label>Codigo</label>
          <input type="text" name="codigo" [(ngModel)]="codigo">
        </div>

        <div class="campo">
          <label>Stock</label>
          <input type="number" name="stock" [(ngModel)]="stock">
        </div>

        <div class="campo">
          <label>Stock minimo</label>
          <input type="number" name="stockMin" [(ngModel)]="stockMin">
        </div>

        <div class="campo">
          <label>Precio compra</label>
          <input type="number" name="precioCompra" [(ngModel)]="precioCompra">
        </div>

        <select name="categoria" [(ngModel)]="categoria">
          <option value="">
            Seleccione una categoria
          </option>
          <option value="BATERIAS">Bateria</option>
          <option value="ALTERNADORES">alternadores</option>
          <option value="MOTORES_ARRANQUE">Motor arranque</option>
          <option value="ILUMINACION">Iluminacion</option>
          <option value="ENCENDIDO">Encendido</option>
          <option value="FUSIBLES_RELES">Fusible o reles</option>
          <option value="CABLEADO_CONECTORES">Cableado o conectores</option>
          <option value="MODULOS_ECU">Modulo ecu</option>
          <option value="OTROS">Otros</option>
        </select>

        <div class="botones">
          
          <button type="submit" class="btn-crear">Crear repuesto</button>
          <button class="btn-cancelar" (click)="volverAtras()" type="button">Cancelar</button>
        </div>
      </form>

     </div>
  </main>
</div>
